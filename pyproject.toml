[project]
name = "mojo-zstd"
version = "0.1.1"
description = "zstd and lz4 frame compression for Mojo through the system libzstd and liblz4"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[dependency-groups]
dev = ["zstandard", "lz4"]

[tool.mojo]
packages = ["lz4", "zstd"]  # one conda package carries both .mojoc files
