# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.0

package:
  name: "mojo-zstd"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/lz4 -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/lz4.mojoc
    - mojo precompile src/zstd -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/zstd.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-zstd
  license: Apache-2.0
  license_file: LICENSE
  summary: zstd and lz4 frame compression for Mojo through the system libzstd and liblz4
  repository: https://github.com/amarbaro/mojo-zstd

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-zstd
